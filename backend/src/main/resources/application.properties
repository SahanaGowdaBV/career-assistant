spring.application.name=career-assistant-api
server.port=${PORT:8080}

# No profile is forced here. Use "local" explicitly for local development.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
app.security.supabase-issuer=${SUPABASE_AUTH_ISSUER:}
app.security.supabase-jwks-uri=${SUPABASE_AUTH_JWKS_URI:}
app.security.allowed-emails=${APP_ALLOWED_EMAILS:}
app.security.scraper-ingestion-token=${SCRAPER_INGESTION_TOKEN:}
management.endpoints.web.exposure.include=health
career.resume.max-size-bytes=${RESUME_MAX_SIZE_BYTES:5242880}
career.resume.storage=${RESUME_STORAGE:in-memory}
career.resume.supabase.url=${SUPABASE_URL:}
career.resume.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
career.resume.supabase.bucket=${SUPABASE_RESUME_BUCKET:resumes}
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:6MB}
career.application.auto-apply-enabled=${AUTO_APPLY_ENABLED:false}
career.application.dry-run=${AUTO_APPLY_DRY_RUN:true}
career.application.allowlisted-domains=${AUTO_APPLY_ALLOWLIST:boards.greenhouse.io,jobs.lever.co,apply.workable.com,jobs.ashbyhq.com}
career.application.minimum-score=${AUTO_APPLY_MINIMUM_SCORE:80}
career.application.max-real-submissions-daily=${AUTO_APPLY_DAILY_LIMIT:1}
career.mail.enabled=${MAIL_ENABLED:false}
career.mail.username=${MAIL_USERNAME:}
career.mail.app-password=${MAIL_APP_PASSWORD:}
career.mail.notification-to=${APPLICATION_NOTIFICATION_TO:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
career.cleanup.enabled=${CLEANUP_ENABLED:false}
career.cleanup.dry-run=${CLEANUP_DRY_RUN:true}
career.cleanup.cron=${CLEANUP_CRON:0 30 2 * * *}
career.cleanup.zone=${CLEANUP_ZONE:Asia/Kolkata}
career.cleanup.unused-documents-days=${CLEANUP_UNUSED_DOCUMENTS_DAYS:30}
career.cleanup.rejected-jobs-days=${CLEANUP_REJECTED_JOBS_DAYS:90}
career.cleanup.failed-attempts-days=${CLEANUP_FAILED_ATTEMPTS_DAYS:90}
career.cleanup.successful-applications-days=${CLEANUP_SUCCESSFUL_APPLICATIONS_DAYS:365}
