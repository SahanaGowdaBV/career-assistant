spring.application.name=career-assistant-api

# No profile is forced here. Use "local" explicitly for local development.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
career.resume.max-size-bytes=${RESUME_MAX_SIZE_BYTES:5242880}
career.resume.storage=${RESUME_STORAGE:in-memory}
career.resume.supabase.url=${SUPABASE_URL:}
career.resume.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
career.resume.supabase.bucket=${SUPABASE_RESUME_BUCKET:resumes}
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:6MB}
