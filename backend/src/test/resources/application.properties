spring.profiles.active=test

# Test-only, in-memory datasource. Maven Surefire repeats the connection settings
# as system properties so environment variables cannot redirect tests externally.
spring.datasource.url=jdbc:h2:mem:career_assistant_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
career.resume.storage=in-memory
app.security.supabase-issuer=https://test-project.supabase.co/auth/v1
app.security.supabase-jwks-uri=https://test-project.supabase.co/auth/v1/.well-known/jwks.json
app.security.allowed-emails=allowed@example.com
app.security.scraper-ingestion-token=test-ingestion-token
