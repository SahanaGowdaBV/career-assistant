name: UAE Scraper Ingestion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scrape without backend writes
        required: true
        type: boolean
        default: true
      maximum_results:
        description: Maximum accepted jobs (1-50)
        required: true
        default: '50'
  schedule:
    - cron: '20 2 * * *'

concurrency:
  group: uae-scraper-ingestion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: python -m pip install --requirement scraper/requirements.txt

      - name: Run scraper tests
        working-directory: scraper
        run: python -m pytest

      - name: Scrape public UAE career endpoints
        env:
          CAREER_API_URL: ${{ secrets.CAREER_API_URL }}
          SCRAPER_INGESTION_TOKEN: ${{ secrets.SCRAPER_INGESTION_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
          MAXIMUM_RESULTS: ${{ inputs.maximum_results || '50' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scraper/run.py --dry-run --max-results "$MAXIMUM_RESULTS" --max-candidates 200 --summary-file scraper-summary.json
          else
            test -n "$CAREER_API_URL" || { echo "::error::CAREER_API_URL is required for live ingestion"; exit 1; }
            test -n "$SCRAPER_INGESTION_TOKEN" || { echo "::error::SCRAPER_INGESTION_TOKEN is required for live ingestion"; exit 1; }
            python scraper/run.py --live --max-results "$MAXIMUM_RESULTS" --max-candidates 200 --summary-file scraper-summary.json
          fi

      - name: Upload non-sensitive source summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uae-scraper-summary
          path: scraper-summary.json
          if-no-files-found: warn
          retention-days: 14
